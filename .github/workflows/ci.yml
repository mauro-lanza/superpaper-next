name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # setup-uv v8 has no major/minor tags, so the full version is pinned.
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      # gui/linux extras need system build deps and are not installed.
      - name: Install dev tooling
        run: uv sync --frozen --group dev

      - name: Ruff lint
        run: uv run ruff check --output-format=github

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Type check (ty)
        run: uv run ty check

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

  gui:
    name: GUI tests (wxPython, Xvfb)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install GTK runtime and Xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0t64 libnotify4 libsdl2-2.0-0 libxtst6

      - name: Install dev tooling
        run: uv sync --frozen --group dev

      - name: Install prebuilt wxPython wheel
        run: uv pip install https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/wxpython-4.2.5-cp314-cp314-linux_x86_64.whl

      - name: GUI tests
        run: xvfb-run -a uv run --no-sync pytest -m gui -q
