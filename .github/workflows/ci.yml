name: CI

# Lint, format, type-check and headless tests on the dev group only.

on:
  push:
    branches: [master]
  pull_request:

# Least-privilege: the lint job only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # setup-uv v8 has no major/minor tags, so the full version is pinned.
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      # gui/linux extras need system build deps and are not installed.
      - name: Install dev tooling
        run: uv sync --frozen --group dev

      - name: Ruff lint
        run: uv run ruff check --output-format=github

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Type check (ty)
        run: uv run ty check

      - name: Test
        run: uv run pytest
