[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "superpaper"
dynamic = ["version"]
description = "Cross-platform wallpaper manager that focuses on multi-monitor support. Features include ppi corrections, keyboard shortcuts, slideshow."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Henri Hänninen" }]
keywords = ["dual-monitor", "multi-monitor", "wallpaper", "background", "manager"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
# xcffib and xpybutil: system_hotkey imports them on Linux but does not declare them.
dependencies = [
    "Pillow>=12.2.0",
    "screeninfo>=0.8.1",
    "numpy>=2.5.0",
    "system_hotkey310>=1.0.5",
    "xcffib>=1.12.0 ; sys_platform == 'linux'",
    "xpybutil>=0.0.6 ; sys_platform == 'linux'",
    "pywin32 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
# On Linux wxPython has no PyPI wheel (see docs/installation-linux.md).
gui = ["wxPython>=4.2.5"]
# dbus-python builds from source and needs libdbus and glib headers.
linux = ["dbus-python>=1.4.0"]

[project.urls]
Homepage = "https://github.com/hhannine/superpaper"
Repository = "https://github.com/mauro-lanza/superpaper-next"

[project.scripts]
superpaper = "superpaper.__main__:main"

[tool.setuptools.packages.find]
include = ["superpaper*"]

[tool.setuptools.dynamic]
version = { attr = "superpaper.__version__.__version__" }

[tool.setuptools.package-data]
superpaper = ["resources/*.png", "resources/*.svg", "resources/example_profiles/*.profile"]

[tool.setuptools.data-files]
"share/applications" = ["superpaper/resources/superpaper.desktop"]
"share/icons/hicolor/scalable/apps" = ["superpaper/resources/superpaper.svg"]
"share/icons/hicolor/96x96/apps" = ["superpaper/resources/superpaper.png"]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "ty>=0.0.58",
    "pre-commit>=4.6.0",
    "pytest>=9.0.2",
]
build = [
    "pyinstaller==6.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["superpaper"]
extend-exclude = [
    "build",
    "dist",
    "releases",
    "release-tooling",
    "docs/examples",
    ".venv",
    "superpaper.egg-info",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear (likely bugs)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "PIE",  # flake8-pie (misc lints)
    "ISC",  # implicit string concatenation
    "TRY",  # tryceratops (exception anti-patterns)
    "EM",   # flake8-errmsg (exception message hygiene)
    "FURB", # refurb (modernizations)
    "DTZ",  # flake8-datetimez
    "INP",  # implicit namespace packages
]
ignore = [
    "E501",    # line length: not enforced as a lint error (formatter handles wrapping)
    "E741",    # ambiguous variable names (e.g. l) - common in legacy code
    "ISC001",  # single-line implicit string concat: conflicts with the formatter
    "SIM108",  # if-else block vs ternary: ternaries often hurt readability here
    "SIM105",  # contextlib.suppress: slower and less explicit than try/except/pass
    "RUF059",  # unused unpacked variable: legacy tuple unpacking is intentional
    "RUF002",  # ambiguous unicode char in docstring: false positives
    "B905",    # zip() without strict=: deferred -- needs per-call review
]

[tool.ruff.lint.isort]
known-first-party = ["superpaper"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ty.src]
include = ["superpaper"]
exclude = [
    "build",
    "dist",
    "releases",
    "release-tooling",
    ".venv",
    "**/__pycache__",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
# The `ty: ignore[unresolved-import]` comments on wx/dbus/win32/AppKit imports are needed
# where those optional packages are absent (CI) and unused where they are installed (a GUI
# development venv). Both environments must pass, so flagging unused ignores can't work here.
unused-ignore-comment = "ignore"
