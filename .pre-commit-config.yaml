# Pre-commit hooks for superpaper-next.
#
# Tooling (ruff, ty) is managed by uv in the project virtualenv (.venv) via the
# "dev" dependency group in pyproject.toml. uv itself lives in ./.venv-tools.
#
# One-time bootstrap on a fresh checkout:
#     .venv-tools/bin/uv sync --group dev
#     .venv-tools/bin/uv run pre-commit install
#
# Run manually against everything:
#     .venv-tools/bin/uv run pre-commit run --all-files

minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit]

repos:
  # ---- General file hygiene -------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: debug-statements

  # ---- Ruff: lint + format (uv-managed, from .venv) -------------------------
  # These call the uv-managed binaries in .venv so the versions always match
  # pyproject.toml / uv.lock (single source of truth, no duplicated pins).
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # ---- ty: static type checking ---------------------------------------
      # ty type-checks the whole project (it needs every module + the installed
      # third-party deps in .venv to resolve types), so filenames are not passed.
      - id: ty
        name: ty (type check)
        entry: .venv/bin/ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
